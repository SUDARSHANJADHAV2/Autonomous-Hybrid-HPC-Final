- name: Validate Slurm accounting secret is supplied
  ansible.builtin.assert:
    that:
      - slurm_db_password is defined
      - slurm_db_password | length >= 12
      - slurm_db_password != 'CHANGE_ME_USE_ANSIBLE_VAULT'
    fail_msg: "Set slurm_db_password in Ansible Vault before enabling SlurmDBD."

- name: Install Slurm controller and accounting stack
  ansible.builtin.package:
    name:
      - slurmctld
      - slurmdbd
      - mariadb-server
      - munge
    state: present

- name: Install Slurm configuration
  ansible.builtin.template:
    src: slurm.conf.j2
    dest: /etc/slurm/slurm.conf
    owner: root
    group: root
    mode: '0644'
  notify: restart slurmctld

- name: Install slurmdbd configuration
  ansible.builtin.template:
    src: slurmdbd.conf.j2
    dest: /etc/slurm/slurmdbd.conf
    owner: slurm
    group: slurm
    mode: '0600'
  no_log: true
  notify: restart slurmdbd

- name: Install controller cgroup configuration
  ansible.builtin.template:
    src: cgroup.conf.j2
    dest: /etc/slurm/cgroup.conf
    owner: root
    group: root
    mode: '0644'

- name: Ensure Slurm state directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ slurm_user }}"
    group: "{{ slurm_group }}"
    mode: '0755'
  loop:
    - /var/lib/slurm/slurmctld
    - /var/log/slurm
    - /var/spool/slurmd

- name: Install MariaDB Python client
  ansible.builtin.package:
    name: python3-pymysql
    state: present

- name: Create Slurm accounting database
  community.mysql.mysql_db:
    name: "{{ slurm_db_name }}"
    state: present
    check_implicit_admin: true

- name: Create Slurm accounting database user
  community.mysql.mysql_user:
    name: "{{ slurm_db_user }}"
    host: "localhost"
    password: "{{ slurm_db_password }}"
    priv: "{{ slurm_db_name }}.*:ALL"
    state: present
    check_implicit_admin: true
  no_log: true

- name: Enable MariaDB
  ansible.builtin.service:
    name: mariadb
    enabled: true
    state: started

- name: Enable Munge
  ansible.builtin.service:
    name: munge
    enabled: true
    state: started

- name: Enable Slurm accounting daemon
  ansible.builtin.service:
    name: slurmdbd
    enabled: true
    state: started

- name: Enable controller daemon
  ansible.builtin.service:
    name: slurmctld
    enabled: true
    state: started
