- name: Install common packages
  ansible.builtin.package:
    name:
      - chrony
      - munge
      - openssh-server
      - curl
      - rsync
    state: present

- name: Enable chrony on Debian-family systems
  ansible.builtin.service:
    name: chrony
    enabled: true
    state: started
  when: ansible_os_family == 'Debian'

- name: Enable chronyd on RPM-family systems
  ansible.builtin.service:
    name: chronyd
    enabled: true
    state: started
  when: ansible_os_family in ['RedHat', 'Rocky', 'Fedora']

- name: Ensure Slurm user exists
  ansible.builtin.user:
    name: "{{ slurm_user }}"
    system: true
    create_home: true

- name: Generate cluster Munge key on controller when missing
  ansible.builtin.command: mungekey -c
  args:
    creates: "{{ munge_key_path }}"
  when:
    - inventory_hostname in groups.get('controllers', [])
  notify: restart munge

- name: Verify controller Munge key exists
  ansible.builtin.stat:
    path: "{{ munge_key_path }}"
  register: controller_munge_key
  delegate_to: "{{ groups['controllers'][0] }}"
  run_once: true

- name: Refuse deployment without a shared Munge key
  ansible.builtin.assert:
    that:
      - controller_munge_key.stat.exists
    fail_msg: "The controller must have {{ munge_key_path }} before workers can be configured."
  run_once: true

- name: Read shared Munge key from controller
  ansible.builtin.slurp:
    src: "{{ munge_key_path }}"
  register: shared_munge_key
  delegate_to: "{{ groups['controllers'][0] }}"
  run_once: true

- name: Install identical Munge key on every node
  ansible.builtin.copy:
    content: "{{ shared_munge_key.content | b64decode }}"
    dest: "{{ munge_key_path }}"
    owner: munge
    group: munge
    mode: '0400'
  no_log: true
  notify: restart munge

- name: Install managed hosts file
  ansible.builtin.template:
    src: hosts.j2
    dest: /etc/hosts
    mode: '0644'
