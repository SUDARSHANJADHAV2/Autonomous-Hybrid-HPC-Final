- name: Install Slurm compute daemon and runtime dependencies
  ansible.builtin.package:
    name:
      - slurmd
      - munge
    state: present

- name: Install cgroup configuration
  ansible.builtin.template:
    src: cgroup.conf.j2
    dest: /etc/slurm/cgroup.conf
    owner: root
    group: root
    mode: '0644'
  notify: restart slurmd

- name: Install GPU GRES configuration only on GPU workers
  ansible.builtin.template:
    src: gres.conf.j2
    dest: /etc/slurm/gres.conf
    owner: root
    group: root
    mode: '0644'
  when: gpu_enabled | bool
  notify: restart slurmd

- name: Ensure Slurm spool directory exists
  ansible.builtin.file:
    path: /var/spool/slurmd
    state: directory
    owner: "{{ slurm_user }}"
    group: "{{ slurm_group }}"
    mode: '0755'

- name: Enable slurmd
  ansible.builtin.service:
    name: slurmd
    enabled: true
    state: started
