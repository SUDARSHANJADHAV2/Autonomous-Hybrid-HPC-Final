[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-hybrid-hpc"
version = "1.1.0"
description = "Autonomous hybrid HPC management and reliability platform for Slurm"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "PyYAML>=6.0,<7",
  "jsonschema>=4.23,<5",
  "pydantic>=2.8,<3",
  "requests>=2.32,<3"
]

[project.optional-dependencies]
ai = ["google-genai>=1.0,<2"]
ml = ["scikit-learn>=1.5,<2", "xgboost>=2.1,<4"]
dev = ["pytest>=8.3,<9", "pytest-cov>=5,<6", "ruff>=0.9,<1", "mypy>=1.13,<2"]

[project.scripts]
hpcctl = "hpc_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
