global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/rules/*.yml
scrape_configs:
  - job_name: node
    static_configs:
      - targets: ['host.docker.internal:9100']
  - job_name: slurm
    static_configs:
      # Configure a real slurm exporter endpoint on the controller before enabling this target.
      - targets: ['host.docker.internal:8080']
  - job_name: dcgm
    static_configs:
      # NVIDIA DCGM exporter is expected on a GPU host; do not expose 9400 publicly.
      - targets: ['host.docker.internal:9400']
